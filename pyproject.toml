[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "napari"
version = "0.9.2+naparixx.2"
description = "A napari source fork with a C++ application core and nanobind bindings"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE", "licenses/napari-BSD-3-Clause.txt", "licenses/VisPy-BSD-3-Clause.txt"]
dependencies = [
    "app-model>=0.5.0,<0.6.0", "cachey>=0.2.1", "certifi>=2018.1.18",
    "dask[array]>=2022.1.1", "imageio>=2.20,!=2.22.1", "jsonschema>=3.2.0",
    "lazy_loader>=0.3", "magicgui>=0.7.0", "napari-console>=0.1.4",
    "napari-plugin-engine>=0.2.1", "napari-resources>=1.0.1", "napari-svg>=0.1.8",
    "npe2>=0.9.0", "numpy>=1.25", "pandas>=1.5.0", "Pillow>=10.0", "pint>=0.17",
    "platformdirs>=4.3.0", "psutil>=5.9.4", "psygnal>=0.14.2", "pydantic>=2.8.0",
    "pygments>=2.13.0", "pydantic-extra-types", "pydantic-settings", "PyOpenGL>=3.1.10",
    "pywin32 ; platform_system == 'Windows'", "PyYAML>=6.0", "qtpy>=2.4.0",
    "scikit-image[data]>=0.20.0", "scipy>=1.14.0", "superqt>=0.7.8",
    "tifffile>=2022.7.28", "toolz>=0.12.1", "tqdm>=4.56.0",
    "typing_extensions>=4.12", "vispy>=0.17.0,<0.18", "wrapt>=1.14.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
qt = ["napari[pyqt6]"]
pyqt6 = [
    "PyQt6 > 6.5", "PyQt6 != 6.6.1 ; platform_system == 'Darwin'",
    "pyqt6-qt6 !=6.11.0, !=6.11.1",
]
pyside6 = ["PySide6 > 6.7, !=6.11.0, !=6.11.1"]
pyqt = ["napari[pyqt6]"]
pyside = ["napari[pyside6]"]
pyqt5 = ["PyQt5>=5.15.8", "pyqt5-qt5<=5.15.2; sys_platform == 'Windows'"]
optional-base = ["zarr>=3.0.8", "aiohttp", "napari-metadata>=0.1.0",
            "napari-plugin-manager>=0.1.10,<0.2.0", "rapidfuzz>=3"]
optional-numba = [
    "numba>=0.58.0,<=0.62.1 ; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "numba>=0.58.0 ; platform_system != 'Darwin' or platform_machine != 'x86_64'",
]
optional = ["napari[optional-base,optional-numba,bermuda]"]
bermuda = ["bermuda>=0.1.5"]
triangle = ["triangle; python_version <= '3.13'"]
partsegcore = ["PartSegCore-compiled-backend>=0.15.11"]
all_optional = ["napari[optional,partsegcore]"]
all = ["napari[pyqt,optional]"]
test = ["pytest>=8", "hypothesis>=6"]
test-upstream = ["napari[test]", "xarray", "zarr>=3.0.8", "matplotlib", "pytest-qt", "pytest-timeout"]
dev = ["napari[test]", "build>=1", "ruff>=0.9", "nanobind>=2.4", "scikit-build-core>=0.10"]

[project.entry-points."napari.manifest"]
napari_builtins = "napari_builtins:builtins.yaml"

[project.scripts]
napari = "napari._main:main"
naparixx = "naparixx.__main__:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/napari", "src/napari_builtins", "src/naparixx"]
sdist.include = [
    "src/**", "cpp/**", "tests/**", "tools/**", "docs/**",
    "upstream.json", "migration.json", "licenses/**",
    "!**/__pycache__/**", "!**/*.pyc", "!**/*.pyo",
]
sdist.exclude = [
    ".upstream/**", ".venv/**", "build/**", "dist/**", ".artifacts/**",
    "**/__pycache__/**", "**/*.pyc", "**/*.pyo",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:pint.*"]
markers = ["gui: requires a Qt binding", "no_qt_log: avoid Python Qt log callbacks during OpenGL initialization"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".upstream", ".artifacts", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"src/napari/**" = ["ALL"]
"src/napari_builtins/**" = ["ALL"]
